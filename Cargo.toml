[package]
name = "fundoubler"
version = "0.3.0"  # Updated version
edition = "2021"
description = "A cross-platform utility for finding and removing file duplicates"
authors = ["Anton A. Truttse (Dargot) <dargot@yandex.ru>"]
license = "MIT"
repository = "https://github.com/AATruttse/fundoubler"
readme = "README.md"

[dependencies]
chrono = "0.4.43"
clap = { version = "4.0", features = ["derive", "env"] }  # Replaced structopt
confy = "2.0.0"
dialoguer = "0.12.0"
indicatif = "0.18.3"  # For progress bars
itertools = "0.14.0"
md5 = "0.8.0"
multimap = "0.10.1"
rayon = "1.8"  # For parallel processing
regex = "1.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0.18"  # For better error handling
toml = "0.8"
walkdir = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }  # Faster hashing

[target.'cfg(unix)'.dependencies]
users = "0.11"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"

[dev-dependencies]
assert_fs = "1.0"
tempfile = "3.6"
criterion = "0.8.1"
walkdir = "2.4"  # Also needed for tests

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
lto = true
codegen-units = 1
